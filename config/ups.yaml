# B 站 UP 名单（后续直接追加即可）
ups:
  - mid: "581897590"
    name: "Agent智能体深度研究院"
    enabled: true
    note: "Agent / 智能体前沿论文解读"

# 标题/简介命中任一关键词才进入论文流水线（空列表 = 不过滤）
title_keywords:
  - 论文
  - Paper
  - paper
  - arXiv
  - arxiv
  - Agent
  - agent
  - LLM
  - 大模型
  - 智能体
  - RAG
  - Transformer
  - 多模态

# 只处理能抽出 arXiv id 的视频
require_arxiv: true

# 每次最多处理多少篇（日常增量 + 回填各受此限制）
max_new_videos_per_run: 3

# 日常增量回看天数
lookback_days: 14

# 历史回填：扫多少页动态、回看多少年
backfill_max_pages: 40
backfill_lookback_days: 3650
